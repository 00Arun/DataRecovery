<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataRecovery</title>
<style>
:root{
  --bg:#f4f6fa;--panel:#ffffff;--panel2:#f8f9fc;--text:#16202e;--muted:#5f6b7d;--line:#e2e6ee;
  --accent:#2563eb;--accent2:#1d4ed8;--accent-soft:#e8efff;--accent-ink:#fff;
  --good:#16a34a;--good-soft:#e7f7ed;--warn:#d97706;--warn-soft:#fdf3e2;--bad:#dc2626;--bad-soft:#fdeaea;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.06);--radius:14px}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1218;--panel:#171b23;--panel2:#1c212b;--text:#e8ebf1;--muted:#98a2b3;--line:#2a303c;
  --accent:#6b9bff;--accent2:#8db1ff;--accent-soft:#1e2a45;--accent-ink:#0b0e14;
  --good:#4ade80;--good-soft:#14301f;--warn:#fbbf24;--warn-soft:#352a12;--bad:#f87171;--bad-soft:#3a1a1a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25)}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI",system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
svg{flex:none}

header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hin{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#7c3aed);display:grid;place-items:center;color:#fff}
.brand b{font-size:17px;display:block;line-height:1.2}
.brand span{font-size:12.5px;color:var(--muted)}
.lang{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:none;padding:6px 14px;font-size:13px;color:var(--muted)}
.lang button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}

.steps{max-width:1180px;margin:0 auto;padding:18px 20px 0;display:flex;gap:8px}
.step{flex:1;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--muted);font-size:14px;min-width:0}
.step i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px;background:var(--panel);border:2px solid var(--line);flex:none}
.step span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.on{color:var(--text);font-weight:600}
.step.on i{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.step.ok i{border-color:var(--good);background:var(--good);color:#fff}
.step.ok{color:var(--text)}

main{max-width:1180px;margin:0 auto;padding:18px 20px 140px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}
h2{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.muted{color:var(--muted)}
.hidden{display:none!important}

.drives{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.drive{position:relative;text-align:left;border:2px solid var(--line);border-radius:12px;padding:16px;background:var(--panel2);display:flex;gap:14px;align-items:center;transition:border-color .15s,background .15s}
.drive:hover:not(:disabled){border-color:var(--accent)}
.drive.on{border-color:var(--accent);background:var(--accent-soft)}
.drive:disabled{opacity:.55;cursor:not-allowed}
.drive .ic{width:48px;height:48px;border-radius:12px;background:var(--panel);display:grid;place-items:center;color:var(--accent);border:1px solid var(--line)}
.drive b{font-size:16px}
.drive small{display:block;color:var(--muted);font-size:13px}
.drive .chk{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:none;place-items:center}
.drive.on .chk{display:grid}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;margin-top:5px;margin-right:4px}
.b-blue{background:var(--accent-soft);color:var(--accent)}
.b-gray{background:var(--line);color:var(--muted)}
.b-red{background:var(--bad-soft);color:var(--bad)}
.b-amber{background:var(--warn-soft);color:var(--warn)}
.note{background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin-top:16px;font-size:14px}
.mode:disabled{opacity:.5;cursor:not-allowed}
.toast{position:fixed;top:78px;right:20px;z-index:60;background:var(--text);color:var(--bg);padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:14px;font-weight:600;opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .2s;pointer-events:none;max-width:360px}
.toast.on{opacity:1;transform:none}
.empty{padding:28px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:12px}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.mode{display:flex;gap:12px;align-items:flex-start;text-align:left;border:2px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--panel2)}
.mode.on{border-color:var(--accent);background:var(--accent-soft)}
.mode .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);margin-top:2px;flex:none;display:grid;place-items:center}
.mode.on .dot{border-color:var(--accent)}
.mode.on .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.mode b{display:block}
.mode small{color:var(--muted);font-size:13px}

.tip{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);border-radius:10px;padding:12px 14px;margin-top:20px;font-size:14px}
.tip svg{color:var(--warn);margin-top:1px}
details{margin-top:16px;color:var(--muted);font-size:14px}
details summary{cursor:pointer}
details .row{margin-top:10px}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.input{flex:1;min-width:200px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);font:inherit}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:600}
.btn:hover:not(:disabled){background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){background:var(--accent2)}
.btn.big{padding:13px 26px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;justify-content:flex-end;margin-top:22px}

.progress-card{text-align:center;padding:48px 24px}
.spin{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;border:6px solid var(--accent-soft);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pct{font-size:40px;font-weight:700;margin:4px 0}
.bar{height:12px;background:var(--accent-soft);border-radius:999px;overflow:hidden;max-width:560px;margin:14px auto}
.bar div{height:100%;background:var(--accent);border-radius:999px;width:0;transition:width .4s}
.bar.ind div{width:35%!important;animation:ind 1.3s ease-in-out infinite}
@keyframes ind{0%{margin-left:-35%}100%{margin-left:100%}}
.pmsg{color:var(--muted);font-size:14px;max-width:640px;margin:0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.found{display:inline-block;margin-top:14px;background:var(--good-soft);color:var(--good);font-weight:600;padding:6px 14px;border-radius:999px}

.alert{display:flex;gap:10px;align-items:flex-start;background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:14px 16px;margin-bottom:16px;font-weight:500}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;box-shadow:var(--shadow)}
.stat.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.stat small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.stat b{font-size:24px;display:block;margin-top:2px}

.layout{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
.side{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px;position:sticky;top:76px;max-height:calc(100vh - 230px);overflow:auto}
.side h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:6px 8px 8px}
.fnode{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:14px;white-space:nowrap}
.fnode:hover{background:var(--panel2)}
.fnode.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.fnode .car{width:16px;color:var(--muted);text-align:center;font-size:11px}
.fnode .nm{flex:1;overflow:hidden;text-overflow:ellipsis}
.fnode .ct{font-size:12px;color:var(--muted);background:var(--panel2);border-radius:999px;padding:0 7px}
.fnode input{margin:0}

.content{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.toolbar .input{min-width:160px;padding:8px 12px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:7px 10px;color:var(--muted);display:grid;place-items:center}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.switch{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.crumb{padding:12px 16px 0;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.crumb b{color:var(--text)}
.link{background:none;border:0;color:var(--accent);padding:0;font-weight:600;font-size:14px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:16px}
.tile{position:relative;border-radius:12px;overflow:hidden;background:var(--panel2);border:2px solid transparent;cursor:pointer}
.tile.sel{border-color:var(--accent)}
.tile .th{aspect-ratio:1;display:grid;place-items:center;background:var(--panel2);color:var(--muted)}
.tile .th img{width:100%;height:100%;object-fit:cover;display:block}
.tile .cap{padding:7px 9px 8px;font-size:12.5px;line-height:1.35}
.tile .cap div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .cap small{color:var(--muted)}
.tick{position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.92);border:2px solid #9aa4b2;display:grid;place-items:center;color:#fff}
.tile.sel .tick{background:var(--accent);border-color:var(--accent)}
.st{position:absolute;top:8px;right:8px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px}
.st.partial{background:var(--warn);color:#fff}.st.overwritten{background:var(--bad);color:#fff}

.list{padding:6px 0}
.lrow{display:grid;grid-template-columns:28px 22px 1fr 150px 90px 120px;gap:10px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.lrow:hover{background:var(--panel2)}
.lrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .m{color:var(--muted);font-size:13px}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;text-align:center}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.partial{background:var(--warn-soft);color:var(--warn)}.pill.overwritten{background:var(--bad-soft);color:var(--bad)}
.more{display:flex;justify-content:center;padding:6px 16px 18px}
.none{padding:48px 16px;text-align:center;color:var(--muted)}

footer{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -4px 20px rgba(16,24,40,.08);z-index:20}
.fin{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.selinfo b{font-size:16px;display:block;line-height:1.2}
.selinfo small{color:var(--muted)}
.dest{flex:1;display:flex;gap:8px;min-width:260px}

.done-card{text-align:center;padding:48px 24px}
.big-ok{width:76px;height:76px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;margin:0 auto 16px}
.path{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-family:Consolas,ui-monospace,monospace;font-size:13.5px;margin:12px 0 22px;word-break:break-all}
.done-card .row{justify-content:center}
.fails{text-align:left;max-width:700px;margin:20px auto 0;color:var(--bad);font-size:13px}

.modal{position:fixed;inset:0;background:rgba(8,12,20,.72);display:grid;place-items:center;z-index:50;padding:20px}
.mbox{background:var(--panel);border-radius:16px;max-width:min(960px,100%);width:100%;max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.mimg{background:#000;display:grid;place-items:center;min-height:240px;max-height:70vh}
.mimg img{max-width:100%;max-height:70vh;display:block}
.minfo{padding:16px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.minfo .t{flex:1;min-width:200px}
.minfo b{display:block;word-break:break-all}

.credit{text-align:center;color:var(--muted);font-size:12.5px;margin:28px 0 0;line-height:1.7}
.credit b{color:var(--text);font-weight:600}
.credit button{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:600}
.credit button:hover{text-decoration:underline}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}.side{position:static;max-height:260px}
  .stats{grid-template-columns:repeat(2,1fr)}.modes{grid-template-columns:1fr}
  .step span{display:none}.step{justify-content:center}
  .lrow{grid-template-columns:28px 22px 1fr 90px}.lrow .hide-s{display:none}
  .brand span{display:none}.hin{padding:10px 16px;gap:10px}.steps{padding:14px 16px 0}
  main{padding:14px 16px 200px}.card{padding:18px}
  .input{min-width:0}.toolbar .input{flex-basis:100%}
  .fin{padding:12px 16px}.selinfo{flex:1}.dest{min-width:0;flex-basis:100%;order:3}
  .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding:12px}
  .drives{grid-template-columns:1fr}.btn.big{padding:12px 18px;font-size:15px}
}
</style>
</head>
<body>
<header><div class="hin">
  <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/></svg></div>
  <div class="brand"><b>DataRecovery</b><span data-i="tagline"></span></div>
  <div class="lang"><button data-lang="en">English</button><button data-lang="ne">नेपाली</button></div>
</div></header>

<nav class="steps" id="steps"></nav>

<main>
  <div id="alert" class="alert hidden"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg><div id="alertMsg"></div></div>

  <!-- Step 1: choose drive -->
  <section id="vDrive" class="card">
    <h2 data-i="pickTitle"></h2>
    <p class="sub" data-i="pickSub"></p>
    <div class="drives" id="drives"></div>
    <div class="row" style="margin-top:12px"><button class="link" id="refresh" data-i="refresh"></button></div>

    <div class="modes">
      <button class="mode on" data-mode="quick"><span class="dot"></span><span><b data-i="quick"></b><small data-i="quickSub"></small></span></button>
      <button class="mode" data-mode="deep"><span class="dot"></span><span><b data-i="deep"></b><small data-i="deepSub"></small></span></button>
    </div>

    <div class="note hidden" id="driveNote"></div>
    <div class="tip"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg><span data-i="tip"></span></div>

    <details><summary data-i="advanced"></summary>
      <div class="row"><input class="input" id="manual" data-ph="manualPh"></div>
    </details>

    <div class="actions"><button class="btn primary big" id="scanBtn" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span data-i="startScan"></span></button></div>
  </section>

  <!-- Step 2 / 4: progress -->
  <section id="vProgress" class="card progress-card hidden">
    <div class="spin"></div>
    <h2 id="pTitle"></h2>
    <div class="pct" id="pPct"></div>
    <div class="bar" id="pBar"><div></div></div>
    <div class="pmsg" id="pMsg"></div>
    <div class="muted" id="pEta" style="font-size:14px;margin-top:4px"></div>
    <div class="found hidden" id="pFound"></div>
    <div style="margin-top:24px"><button class="btn" id="stopBtn" data-i="stop"></button></div>
  </section>

  <!-- Step 3: choose files -->
  <section id="vResults" class="hidden">
    <div class="note hidden" id="rawNote" style="margin:0 0 16px" data-i="rawNote"></div>
    <div class="stats" id="stats"></div>
    <div class="layout">
      <aside class="side"><h3 data-i="folders"></h3><div id="tree"></div></aside>
      <div class="content">
        <div class="toolbar">
          <input class="input" id="search" data-ph="searchPh">
          <label class="switch"><input type="checkbox" id="hideBad" checked><span data-i="hideBad"></span></label>
          <div class="seg" id="viewSeg">
            <button data-view="grid" title="Grid"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
            <button data-view="list" title="List"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
          </div>
        </div>
        <div class="crumb"><span id="crumb"></span><span style="flex:1"></span><button class="link" id="selAll" data-i="selAll"></button><button class="link" id="selNone" data-i="selNone"></button></div>
        <div id="files"></div>
      </div>
    </div>
  </section>

  <!-- Done -->
  <section id="vDone" class="card done-card hidden">
    <div class="big-ok"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h2 id="dTitle"></h2>
    <div class="muted" data-i="savedIn"></div>
    <div class="path" id="dPath"></div>
    <div class="row">
      <button class="btn primary big" id="openBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span data-i="openFolder"></span></button>
      <button class="btn big" id="moreBtn" data-i="recoverMore"></button>
      <button class="btn big" id="anotherBtn" data-i="another"></button>
    </div>
    <div class="fails hidden" id="dFails"></div>
  </section>
  <div class="credit">
    <span data-i="builtBy"></span> <b>Arun Pandey</b> · <b>Arun AI Studio</b> · <button id="siteLink">arun-pandey.com.np</button><br>
    © 2026 Arun Pandey. <span data-i="rights"></span>
  </div>
</main>

<footer id="footer" class="hidden"><div class="fin">
  <div class="selinfo"><b id="selCount"></b><small id="selSize"></small></div>
  <div class="dest">
    <input class="input" id="outDir" data-ph="destPh">
    <button class="btn" id="browseBtn" data-i="browse"></button>
  </div>
  <button class="btn primary big" id="recoverBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span data-i="recover"></span></button>
</div></footer>

<div class="toast" id="toast"></div>
<div class="modal hidden" id="modal">
  <div class="mbox">
    <div class="mimg" id="mImg"></div>
    <div class="minfo">
      <div class="t"><b id="mName"></b><span class="muted" id="mMeta"></span></div>
      <span class="pill" id="mStatus"></span>
      <button class="btn" id="mSel"></button>

</div>

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n >= 1e9 ? (n/1e9).toFixed(2)+' GB' : n >= 1e6 ? (n/1e6).toFixed(1)+' MB' : n > 0 ? Math.max(1, Math.round(n/1e3))+' KB' : '0 KB';
const show = (id, on) => $(id).classList.toggle('hidden', !on);
let lang = 'en';
try { lang = localStorage.getItem('lang') || (navigator.language.startsWith('ne') ? 'ne' : 'en'); } catch (e) {}
const qLang = new URLSearchParams(location.search).get('lang');
if (qLang === 'ne' || qLang === 'en') lang = qLang;
const t = (k, ...a) => { const v = L[lang][k] ?? L.en[k]; return typeof v === 'function' ? v(...a) : v; };

async function api(path, body) {
  const r = await fetch(path, {method: body ? 'POST' : 'GET', headers: {'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && j.error) || r.statusText);
  return j;
}

const IC = {

  all: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  check: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
};
const previewable = p => /\.(jpe?g|png|gif|bmp|webp)$/i.test(p);

/* ---------- state ---------- */
let drives = [], source = '', mode = 'quick', view = 'grid', kind = 'all', folder = '';
let entries = [], byId = new Map(), selected = new Set(), expanded = new Set(['']), limit = 120;
let poller = null, lastPhase = '', rate = null, result = null;
try { view = localStorage.getItem('view') || 'grid'; } catch (e) {}

/* ---------- language ---------- */
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  document.querySelectorAll('[data-i]').forEach(el => el.textContent = t(el.dataset.i));
  document.querySelectorAll('[data-ph]').forEach(el => el.placeholder = t(el.dataset.ph));
  renderDrives(); if (entries.length) renderResults(); setStep(curStep); if (result) renderDone();
}
document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => {
  lang = b.dataset.lang; try { localStorage.setItem('lang', lang); } catch (e) {} applyLang();
});

let curStep = 1;
function setStep(n) {
  curStep = n;
  $('steps').innerHTML = ['s1','s2','s3','s4'].map((k, i) =>
    `<div class="step ${i+1 === n ? 'on' : i+1 < n ? 'ok' : ''}"><i>${i+1 < n ? IC.check : i+1}</i><span>${t(k)}</span></div>`).join('');
}
function alertMsg(m) { $('alertMsg').textContent = m || ''; show('alert', !!m); if (m) window.scrollTo({top: 0, behavior: 'smooth'}); }

/* ---------- step 1 ---------- */
// Quick scan reads file names, which needs a file system DataRecovery
// understands; any other drive can still be searched by a deep scan.
const quickOK = d => !d || !d.fs || /^(FAT|FAT12|FAT16|FAT32|exFAT|NTFS|RAW)$/i.test(d.fs);
const current = () => drives.find(d => d.path === source);
let userPicked = false, knownDrives = null, toastTimer = null;

async function loadDrives() {
  let list;
  try { list = await api('/api/drives') || []; } catch (e) { return; }
  list.sort((a, b) => (b.removable - a.removable) || a.letter.localeCompare(b.letter));
  const before = knownDrives, paths = new Set(list.map(d => d.path));
  if (before) {
    const added = list.filter(d => !before.has(d.path)), removed = [...before.keys()].filter(p => !paths.has(p));
    if (added.length) {
      const d = added[0];
      toast(t('newDrive', `${d.letter} ${d.label || t('noName')}`));
      if (!userPicked || !paths.has(source)) { source = d.path; userPicked = false; }
    } else if (removed.length) {
      toast(t('driveRemoved', before.get(removed[0])));
    }
  }
  knownDrives = new Map(list.map(d => [d.path, `${d.letter} ${d.label || t('noName')}`]));
  drives = list;
  if (source && !paths.has(source)) source = '';
  if (!source) { const d = drives.find(d => d.removable) || null; if (d) source = d.path; }
  renderDrives();
}
setInterval(() => { if (!$('vDrive').classList.contains('hidden')) loadDrives(); }, 2000);

function toast(msg) {
  const el = $('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 5000);
}

function renderDrives() {
  const el = $('drives');
  if (!drives.length) { el.innerHTML = `<div class="empty">${esc(t('noDrives'))}</div>`; updateScanBtn(); return; }
  el.innerHTML = drives.map(d => `<button class="drive ${source === d.path ? 'on' : ''}" data-p="${esc(d.path)}">
      <span class="ic">${d.removable ? IC.sd : IC.disk}</span>
      <span><b>${esc(d.letter)}</b> ${esc(d.label || t('noName'))}
        <small>${esc(d.fs || '?')} · ${d.size ? fmt(d.size) : '?'}</small>
        <span class="badge ${d.removable ? 'b-blue' : 'b-gray'}">${esc(d.removable ? t('removable') : t('fixed'))}</span>${d.system ? `<span class="badge b-gray">${esc(t('thisComputer'))}</span>` : ''}${quickOK(d) ? '' : `<span class="badge b-amber">${esc(t('deepOnly'))}</span>`}
      </span><span class="chk">${IC.check}</span></button>`).join('');
  el.querySelectorAll('.drive').forEach(b => b.onclick = () => { source = b.dataset.p; userPicked = true; $('manual').value = ''; renderDrives(); });
  updateScanBtn();
}

// The scan choices and notes follow the chosen drive.
function updateScanBtn() {
  $('scanBtn').disabled = !(source || $('manual').value.trim());
  const d = $('manual').value.trim() ? null : current();
  const quick = document.querySelector('[data-mode="quick"]');
  quick.disabled = !quickOK(d);
  if (!quickOK(d) && mode === 'quick') setMode('deep');
  const notes = [];
  if (!quickOK(d)) notes.push(t('quickUnavailable'));
  if (d && !d.removable) notes.push(t('internalNote'));
  $('driveNote').innerHTML = notes.map(esc).join('<br><br>');
  show('driveNote', notes.length > 0);
}
function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode').forEach(x => x.classList.toggle('on', x.dataset.mode === m));
}
$('manual').oninput = () => { if ($('manual').value.trim()) { source = ''; renderDrives(); } updateScanBtn(); };
$('refresh').onclick = loadDrives;
document.querySelectorAll('.mode').forEach(b => b.onclick = () => { if (!b.disabled) setMode(b.dataset.mode); });
$('scanBtn').onclick = async () => {
  let src = $('manual').value.trim() || source;
  if (/^[a-z]:?\\?$/i.test(src)) src = '\\\\.\\' + src[0].toUpperCase() + ':';
  alertMsg('');
  try { await api('/api/scan', {Source: src, Deep: mode === 'deep'}); entries = []; result = null; startPolling(); }
  catch (e) { alertMsg(e.message); }
};

/* ---------- progress ---------- */
$('stopBtn').onclick = () => api('/api/cancel', {});
function startPolling() { clearInterval(poller); rate = null; poller = setInterval(poll, 600); poll(); }
function fmtDur(s) {
  if (s < 60) return lang === 'ne' ? `${Math.max(5, Math.round(s/5)*5)} सेकेन्ड` : `${Math.max(5, Math.round(s/5)*5)} sec`;
  const m = Math.round(s / 60);
  return lang === 'ne' ? `${m} मिनेट` : `${m} min`;
}
async function poll() {
  let s; try { s = await api('/api/status'); } catch (e) { return; }
  const busy = s.phase === 'scanning' || s.phase === 'recovering';
  if (s.defaultOut && !$('outDir').value) $('outDir').value = s.defaultOut;
  if (busy) {
    ['vDrive','vResults','vDone','footer'].forEach(id => show(id, false)); show('vProgress', true);
    setStep(s.phase === 'scanning' ? 2 : 4);
    $('pTitle').textContent = t(s.phase);
    const pct = s.total ? s.done / s.total : 0;
    $('pBar').classList.toggle('ind', !s.total);
    $('pBar').firstElementChild.style.width = (pct * 100).toFixed(1) + '%';
    $('pPct').textContent = s.total ? Math.floor(pct * 100) + '%' : '';
    const known = {'Reading folders': 'readingFolders', 'Reading the file table': 'readingTable',
      'Deep scan: searching free space': 'deepSearching', 'Deep scan: recovering photos and videos without names': 'deepRecovering'};
    let msg = known[s.msg] ? t(known[s.msg]) : s.msg;
    if (s.phase === 'recovering') msg = msg.replace(/^Recovering /, '');
    $('pMsg').textContent = msg;
    const now = Date.now();
    if (s.total && s.done > 0) {
      if (!rate || rate.msg !== s.msg) rate = {msg: s.msg, t0: now, d0: s.done};
      const el = (now - rate.t0) / 1000, dd = s.done - rate.d0;
      $('pEta').textContent = el > 3 && dd > 0 ? t('eta', fmtDur((s.total - s.done) * el / dd)) : '';
    } else $('pEta').textContent = '';
    show('pFound', s.phase === 'scanning' && s.count > 0);
    $('pFound').textContent = t('foundSoFar', s.count);
    lastPhase = s.phase;
    return;
  }
  clearInterval(poller);
  show('vProgress', false);
  if (s.phase === 'error') { alertMsg(s.msg); toDrive(); return; }
  if (s.phase === 'ready') { alertMsg(s.msg); await loadEntries(s); return; }
  if (s.phase === 'done' && s.result) { result = s.result; if (!entries.length) await loadEntries(s, true); renderDone(); return; }
  toDrive();
}
function toDrive() { ['vResults','vDone','footer','vProgress'].forEach(id => show(id, false)); show('vDrive', true); setStep(1); }

/* ---------- step 3 ---------- */
async function loadEntries(s, quiet) {
  entries = await api('/api/entries') || [];
  byId = new Map(entries.map(e => [e.id, e]));
  selected = new Set(entries.filter(e => e.status !== 'overwritten').map(e => e.id));
  kind = 'all'; folder = ''; expanded = new Set(['']); limit = 120;
  const top = new Set(entries.map(e => e.path.split('/')[1]));
  top.forEach(n => expanded.add('/' + n));
  if (quiet) return;
  if (!entries.length) { alertMsg(t('nothingFound')); toDrive(); return; }
  show('vDrive', false); show('vDone', false); show('vResults', true); show('footer', true); setStep(3);
  show('rawNote', s.fs === 'Raw');
  renderResults();
}

const kindOk = e => kind === 'all' || e.kind === kind;
function filtered(inFolder) {
  const q = $('search').value.trim().toLowerCase(), hide = $('hideBad').checked;
  return entries.filter(e => kindOk(e) && !(hide && e.status === 'overwritten') && (!q || e.path.toLowerCase().includes(q)) &&
    (!inFolder || !folder || e.path.startsWith(folder + '/')));
}

function renderResults() { renderStats(); renderTree(); renderFiles(); renderSel(); }

function renderStats() {
  const c = k => entries.filter(e => k === 'all' || e.kind === k);
  $('stats').innerHTML = [['all', IC.all], ['photo', IC.photo], ['video', IC.video], ['other', IC.other]].map(([k, ic]) => {
    const list = c(k), size = list.reduce((s, e) => s + e.size, 0);
    const label = {all: t('all'), photo: t('photos'), video: t('videos'), other: t('others')}[k];
    return `<button class="stat ${kind === k ? 'on' : ''}" data-k="${k}"><small>${ic.replace(/34/g, '16')} ${esc(label)}</small><b>${list.length.toLocaleString()}</b><small>${fmt(size)}</small></button>`;
  }).join('');
  $('stats').querySelectorAll('.stat').forEach(b => b.onclick = () => { kind = b.dataset.k; limit = 120; renderResults(); });
}

function folderLabel(name) {
  if (name === '_Found') return t('foundNoName');
  if (name === '_LostFolders') return t('lostFolders');
  return name;
}

function buildTree(list) {
  const root = {path: '', name: '', kids: new Map(), ids: []};
  for (const e of list) {
    const parts = e.path.split('/').filter(Boolean);
    let n = root; n.ids.push(e.id);
    for (let i = 0; i < parts.length - 1; i++) {
      const p = n.path + '/' + parts[i];
      if (!n.kids.has(parts[i])) n.kids.set(parts[i], {path: p, name: parts[i], kids: new Map(), ids: []});
      n = n.kids.get(parts[i]); n.ids.push(e.id);
    }
  }
  return root;
}

function renderTree() {
  const tree = buildTree(filtered(false));
  const out = [];
  const node = (n, depth) => {
    const sel = n.ids.filter(id => selected.has(id)).length;
    const has = n.kids.size > 0, open = expanded.has(n.path);
    out.push(`<div class="fnode ${folder === n.path ? 'on' : ''}" data-f="${esc(n.path)}" style="padding-left:${8 + depth * 14}px">
      <span class="car" data-x="${esc(n.path)}">${has ? (open ? '▾' : '▸') : ''}</span>
      <input type="checkbox" data-c="${esc(n.path)}" ${sel && sel === n.ids.length ? 'checked' : ''} ${sel && sel < n.ids.length ? 'data-ind="1"' : ''}>
      <span class="nm">${esc(n.path ? folderLabel(n.name) : t('allFolders'))}</span><span class="ct">${n.ids.length}</span></div>`);
    if (open) [...n.kids.values()].sort((a, b) => a.name.localeCompare(b.name)).forEach(k => node(k, depth + 1));
  };
  node(tree, 0);
  $('tree').innerHTML = out.join('');
  $('tree').querySelectorAll('[data-ind]').forEach(c => c.indeterminate = true);
}
$('tree').addEventListener('click', ev => {
  const x = ev.target.closest('[data-x]'), c = ev.target.dataset.c, f = ev.target.closest('[data-f]');
  if (c !== undefined) {
    const on = ev.target.checked;
    filtered(false).forEach(e => { if (!c || e.path.startsWith(c + '/')) on ? selected.add(e.id) : selected.delete(e.id); });
    renderTree(); renderFiles(); renderSel(); return;
  }
  if (x && x.textContent) { const p = x.dataset.x; expanded.has(p) ? expanded.delete(p) : expanded.add(p); renderTree(); return; }
  if (f) { folder = f.dataset.f; expanded.add(folder); limit = 120; renderTree(); renderFiles(); }
});

function renderFiles() {
  const list = filtered(true).sort((a, b) => a.path.localeCompare(b.path));
  const fname = folder ? folderLabel(folder.slice(folder.lastIndexOf('/') + 1)) : t('allFolders');
  $('crumb').innerHTML = t('showing', list.length.toLocaleString(), esc(fname));
  document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  if (!list.length) { $('files').innerHTML = `<div class="none">${esc(t('nothing'))}</div>`; return; }
  const shown = list.slice(0, limit);
  const name = e => e.path.slice(e.path.lastIndexOf('/') + 1);
  const date = e => e.mtime && !e.mtime.startsWith('0001') ? new Date(e.mtime).toLocaleDateString() : '';
  let html;
  if (view === 'grid') {
    html = '<div class="grid">' + shown.map(e => `<div class="tile ${selected.has(e.id) ? 'sel' : ''}" data-id="${e.id}">
      <div class="th">${previewable(e.path) ? `<img loading="lazy" src="/api/thumb?id=${e.id}" alt="" onerror="this.replaceWith(document.createRange().createContextualFragment(IC.${e.kind}))">` : IC[e.kind]}</div>
      <span class="tick" data-tick="${e.id}">${selected.has(e.id) ? IC.check : ''}</span>
      ${e.status !== 'good' ? `<span class="st ${e.status}">${esc(t(e.status))}</span>` : ''}
      <div class="cap"><div title="${esc(name(e))}">${esc(name(e))}</div><small>${fmt(e.size)}${date(e) ? ' · ' + esc(date(e)) : ''}</small></div></div>`).join('') + '</div>';
  } else {
    html = '<div class="list">' + shown.map(e => `<div class="lrow" data-id="${e.id}">
      <input type="checkbox" data-tick="${e.id}" ${selected.has(e.id) ? 'checked' : ''}>
      <span class="muted">${IC[e.kind].replace(/34/g, '18')}</span>
      <span class="nm" title="${esc(e.path)}">${esc(name(e))}</span>
      <span class="m hide-s">${esc(date(e))}</span><span class="m">${fmt(e.size)}</span>
      <span class="pill ${e.status} hide-s">${esc(t(e.status))}</span></div>`).join('') + '</div>';
  }
  if (list.length > limit) html += `<div class="more"><button class="btn" id="moreFiles">${esc(t('showMore', Math.min(240, list.length - limit)))}</button></div>`;
  $('files').innerHTML = html;
  const m = $('moreFiles'); if (m) m.onclick = () => { limit += 240; renderFiles(); };
}
$('files').addEventListener('click', ev => {
  const tick = ev.target.closest('[data-tick]');
  if (tick) { toggle(+tick.dataset.tick); return; }
  const row = ev.target.closest('[data-id]');
  if (row) view === 'grid' ? openPreview(+row.dataset.id) : toggle(+row.dataset.id);
});
function toggle(id) {
  selected.has(id) ? selected.delete(id) : selected.add(id);
  const el = $('files').querySelector(`[data-id="${id}"]`);
  if (el) {
    el.classList.toggle('sel', selected.has(id));
    const tk = el.querySelector('[data-tick]');
    if (tk.tagName === 'INPUT') tk.checked = selected.has(id); else tk.innerHTML = selected.has(id) ? IC.check : '';
  }
  renderTree(); renderSel();
}
document.querySelectorAll('#viewSeg button').forEach(b => b.onclick = () => {
  view = b.dataset.view; try { localStorage.setItem('view', view); } catch (e) {} renderFiles();
});
$('search').oninput = () => { limit = 120; renderTree(); renderFiles(); renderSel(); };
$('hideBad').onchange = () => { renderTree(); renderFiles(); renderSel(); };
$('selAll').onclick = () => { filtered(true).forEach(e => selected.add(e.id)); renderTree(); renderFiles(); renderSel(); };
$('selNone').onclick = () => { filtered(true).forEach(e => selected.delete(e.id)); renderTree(); renderFiles(); renderSel(); };

function chosen() { return filtered(false).filter(e => selected.has(e.id)); }
function renderSel() {
  const c = chosen();
  $('selCount').textContent = t('selected', c.length.toLocaleString());
  $('selSize').textContent = t('of', fmt(c.reduce((s, e) => s + e.size, 0)));
  $('recoverBtn').disabled = !c.length;
}

/* ---------- preview ---------- */
let mId = null;
function openPreview(id) {
  const e = byId.get(id); mId = id;
  $('mImg').innerHTML = previewable(e.path) ? `<img src="/api/file?id=${id}" alt="">` : `<div class="muted" style="padding:60px;color:#aab">${IC[e.kind]}<div>${esc(t('noPreview'))}</div></div>`;
  $('mName').textContent = e.path;
  const d = e.mtime && !e.mtime.startsWith('0001') ? new Date(e.mtime).toLocaleString() + ' · ' : '';
  $('mMeta').textContent = d + fmt(e.size);
  $('mStatus').className = 'pill ' + e.status; $('mStatus').textContent = t(e.status);
  renderMSel(); show('modal', true);
}
function renderMSel() { $('mSel').textContent = selected.has(mId) ? t('unselect') : t('select'); $('mSel').classList.toggle('primary', !selected.has(mId)); }
$('mSel').onclick = () => { toggle(mId); renderMSel(); };
$('mClose').onclick = () => show('modal', false);
$('modal').onclick = ev => { if (ev.target === $('modal')) show('modal', false); };
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') show('modal', false); });

/* ---------- step 4 ---------- */
$('browseBtn').onclick = async () => { try { const r = await api('/api/pickfolder'); if (r.path) $('outDir').value = r.path; } catch (e) { alertMsg(e.message); } };
$('recoverBtn').onclick = async () => {
  const ids = chosen().map(e => e.id);
  if (!ids.length) return alertMsg(t('needSel'));
  if (!$('outDir').value.trim()) { alertMsg(t('needDest')); $('outDir').focus(); return; }
  alertMsg('');
  try { await api('/api/recover', {IDs: ids, Out: $('outDir').value.trim()}); result = null; startPolling(); }
  catch (e) { alertMsg(e.message); }
};

function renderDone() {
  if (!result) return;
  ['vDrive','vResults','vProgress','footer'].forEach(id => show(id, false)); show('vDone', true); setStep(5);
  $('dTitle').textContent = t('doneTitle', result.ok.toLocaleString());
  $('dPath').textContent = result.root;
  const f = result.failed || [];
  show('dFails', f.length > 0);
  $('dFails').innerHTML = f.length ? `<b>${esc(t('failed', f.length))}</b><br>` + f.slice(0, 50).map(esc).join('<br>') : '';
}
$('openBtn').onclick = () => api('/api/open', {Path: result.root});
$('moreBtn').onclick = () => { result = null; show('vDone', false); show('vResults', true); show('footer', true); setStep(3); renderResults(); };
$('anotherBtn').onclick = () => { result = null; entries = []; toDrive(); loadDrives(); };

$('siteLink').onclick = () => api('/api/website', {});

/* ---------- start ---------- */
applyLang();
setStep(1);
loadDrives();
poll();
</script>
</body>
</html>
